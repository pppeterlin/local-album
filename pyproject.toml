[project]
name = "local-photo-labeler"
version = "0.3.0"
description = "Local-first photo labeling pipeline: CLIP indexing, smart sampling, OpenAI-compatible Vision API labeling, face clustering, and unified search."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "insightface>=0.7.3",
    "mcp>=1.2.0",
    "numpy>=2.4.4",
    "onnxruntime>=1.26.0",
    "opencv-python>=4.8.0",
    "open-clip-torch>=3.3.0",
    "openai>=2.36.0",
    "pillow>=12.2.0",
    "reverse-geocoder>=1.5.1",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "ultralytics>=8.3.0",
]
