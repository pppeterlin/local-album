<!DOCTYPE html>
<html data-theme="morandi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>登入 · 人臉命名工具</title>
<!--V05_ASSETS-->
<style>
/* v0.5: Morandi login */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,sans-serif;
  background:hsl(var(--b1));color:hsl(var(--bc));
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:hsl(var(--b2));padding:32px 30px;border-radius:16px;border:1px solid hsl(var(--b3));
  max-width:360px;width:100%;box-shadow:0 8px 32px hsl(var(--n) / 0.10)}
h1{font-size:20px;margin-bottom:20px;color:hsl(var(--p));text-align:center;font-weight:500}
input{width:100%;padding:11px 12px;background:hsl(var(--b1));color:hsl(var(--bc));
  border:1px solid hsl(var(--b3));border-radius:8px;font-size:15px;margin-bottom:12px;transition:border-color .15s}
input:focus{border-color:hsl(var(--p));outline:none}
button{width:100%;padding:12px;background:hsl(var(--p));color:hsl(var(--pc));border:none;
  border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;transition:all .2s ease-out}
button:hover{transform:translateY(-1px);box-shadow:0 4px 12px hsl(var(--p) / 0.3)}
button:active{transform:scale(.97)}
.err{color:hsl(var(--er));font-size:13px;margin-top:8px;text-align:center;min-height:20px}
</style>
</head><body>
<form class="card" onsubmit="event.preventDefault();login()">
  <h1>👥 人臉命名工具</h1>
  <input id="u" type="text" placeholder="使用者名稱" autofocus autocomplete="username">
  <input id="p" type="password" placeholder="密碼" autocomplete="current-password">
  <button type="submit">登入</button>
  <div class="err" id="err"></div>
</form>
<script>
function login(){
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({username:document.getElementById('u').value,password:document.getElementById('p').value})})
    .then(r=>r.json()).then(d=>{
      if(d.ok) location.href='/';
      else document.getElementById('err').textContent=d.error||'登入失敗';
    });
}
</script>
</body></html>
