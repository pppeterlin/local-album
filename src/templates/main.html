<!DOCTYPE html>
<html data-theme="morandi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Local Album</title>
<!--USER_INJECT-->
<!--V05_ASSETS-->
<style>
/* v0.5 Phase 2/3 (iOS 26 redesign): generous whitespace, large radii, soft shadows,
   capsule buttons, segmented tabs, content-first chrome. Class names preserved.
*/
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:hsl(var(--b1))}
/* !important on margin to defeat Tailwind Play CDN preflight's body{margin:0}
   which is injected after our <style> in cascade order. */
body{font-family:"Noto Sans TC","PingFang TC",-apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",sans-serif;
  color:hsl(var(--bc));padding:24px 28px 80px;line-height:1.5;
  max-width:1800px !important;margin:0 auto !important;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;letter-spacing:-0.005em}
@media (min-width:2400px){ body{max-width:2200px !important} }

/* lucide icons — display:block so flex centering works without inline-baseline drift */
[data-lucide]{display:block;width:1em;height:1em;stroke-width:1.75;flex-shrink:0}
.icon-btn [data-lucide],
.userbar .icon-only [data-lucide]{width:18px;height:18px}

h1{text-align:left;margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em;color:hsl(var(--bc))}
.subtitle{color:hsl(var(--bc) / 0.55);margin:-6px 0 18px;font-size:13px}

/* ── Top user bar (iOS-style minimal) ── */
.userbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;color:hsl(var(--bc) / 0.7);font-size:14px;gap:12px;flex-wrap:wrap}
.userbar > div{display:flex;align-items:center;gap:10px}
.userbar .who{color:hsl(var(--bc));font-weight:500}
#role-tag{color:hsl(var(--bc) / 0.4);font-size:12px;font-weight:400}
.userbar a,.userbar button{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;background:hsl(var(--b2));color:hsl(var(--bc));border:none;border-radius:999px;
  font-size:13px;cursor:pointer;text-decoration:none;transition:all .2s ease-out;line-height:1}
.userbar a:hover,.userbar button:hover{background:hsl(var(--b3));transform:translateY(-1px);box-shadow:0 2px 8px hsl(var(--n) / 0.06)}
.userbar a:active,.userbar button:active{transform:scale(.96)}
/* icon-only: borderless, ghost icon button — aligns naturally next to text buttons */
.userbar .icon-only{background:transparent;padding:6px;border-radius:50%;
  width:auto;height:auto;color:hsl(var(--bc) / 0.7)}
.userbar .icon-only:hover{background:hsl(var(--b3));color:hsl(var(--bc));box-shadow:none;transform:translateY(-1px)}
.userbar .icon-only > *{width:20px;height:20px;display:block}

/* ── Filter toolbar: pill-style action chips ── */
.toolbar{display:flex;justify-content:flex-start;gap:8px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.toolbar button{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:hsl(var(--b2));
  color:hsl(var(--bc) / 0.75);border:none;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;
  min-height:36px;transition:all .2s ease-out}
.toolbar button:hover{background:hsl(var(--b3));color:hsl(var(--bc));transform:translateY(-1px);box-shadow:0 2px 8px hsl(var(--n) / 0.06)}
.toolbar button:active{transform:scale(.96)}
.toolbar button.active{background:hsl(var(--p));color:hsl(var(--pc));box-shadow:0 2px 10px hsl(var(--p) / 0.25)}

/* ── v0.6 shortcuts (overview / timeline / memories entry cards) ── */
.shortcuts{display:grid;gap:10px;margin-bottom:20px;
  grid-template-columns:1fr}
@media (min-width:720px){ .shortcuts{grid-template-columns:repeat(2,1fr)} }
@media (min-width:1200px){ .shortcuts{grid-template-columns:repeat(3,1fr)} }
.shortcut-card{display:flex;align-items:center;gap:14px;padding:14px 18px;
  background:hsl(var(--b2));color:hsl(var(--bc));border-radius:16px;text-decoration:none;
  transition:transform .2s ease-out, box-shadow .2s ease-out, background .2s}
.shortcut-card:hover{transform:translateY(-2px);background:hsl(var(--b3) / 0.7);
  box-shadow:0 4px 14px hsl(var(--n) / 0.08)}
.shortcut-card:active{transform:scale(.98)}
.shortcut-card .icon{display:inline-flex;align-items:center;justify-content:center;
  width:42px;height:42px;border-radius:12px;background:hsl(var(--p) / 0.18);color:hsl(var(--p));flex-shrink:0}
.shortcut-card .icon [data-lucide]{width:22px;height:22px}
.shortcut-card .text{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}
.shortcut-card .text .title{font-size:15px;font-weight:600;letter-spacing:-0.01em}
.shortcut-card .text .sub{font-size:12px;color:hsl(var(--bc) / 0.55)}
.shortcut-card .chev{color:hsl(var(--bc) / 0.35);width:18px;height:18px;flex-shrink:0}

/* ── Today-memories carousel (top of main page) ── */
.today-mem{margin:8px 0 24px}
.today-mem-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.today-mem-head .label{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:hsl(var(--bc) / 0.7);letter-spacing:.02em}
.today-mem-head .label [data-lucide]{width:14px;height:14px}
.today-mem-head .more{font-size:12px;color:hsl(var(--bc) / 0.5);text-decoration:none;display:inline-flex;align-items:center;gap:2px}
.today-mem-head .more:hover{color:hsl(var(--p))}
.today-mem-head .more [data-lucide]{width:13px;height:13px}
.today-mem-grid{display:grid;gap:10px;grid-template-columns:1fr}
@media (min-width:680px){ .today-mem-grid{grid-template-columns:repeat(3,1fr)} }
.today-mem-card{position:relative;display:block;aspect-ratio:16/10;border-radius:18px;overflow:hidden;cursor:pointer;
  background:hsl(var(--b2)) center/cover no-repeat;text-decoration:none;color:#fff;
  box-shadow:0 1px 3px hsl(var(--n) / 0.08), 0 4px 16px hsl(var(--n) / 0.06);
  transition:transform .25s ease-out, box-shadow .25s ease-out}
.today-mem-card:hover{transform:translateY(-3px);box-shadow:0 6px 22px hsl(var(--n) / 0.14)}
.today-mem-card:active{transform:scale(.98)}
.today-mem-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.05) 55%,rgba(0,0,0,.55) 100%)}
.today-mem-card .meta{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;z-index:1;display:flex;flex-direction:column;gap:2px}
.today-mem-card .tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;
  background:rgba(255,255,255,.18);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border-radius:999px;align-self:flex-start;margin-bottom:6px;letter-spacing:.02em}
.today-mem-card .tag [data-lucide]{width:11px;height:11px}
.today-mem-card .t{font-size:15px;font-weight:600;letter-spacing:-0.01em;text-shadow:0 1px 4px rgba(0,0,0,.4)}
.today-mem-card .s{font-size:11px;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.today-mem-skel{height:120px;border-radius:18px;background:linear-gradient(90deg,hsl(var(--b2)) 25%,hsl(var(--b3) / 0.6) 50%,hsl(var(--b2)) 75%);
  background-size:200% 100%;animation:tm-shimmer 1.4s linear infinite}
@keyframes tm-shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── Kind segmented control (face / pet) ── */
.kind-toggle{display:inline-flex;background:hsl(var(--b2));border-radius:999px;padding:4px;margin-bottom:24px;gap:0}
.kind-toggle button{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:transparent;
  color:hsl(var(--bc) / 0.65);border:none;cursor:pointer;font-size:14px;font-weight:500;min-height:36px;
  border-radius:999px;transition:all .25s ease-out}
.kind-toggle button:hover{color:hsl(var(--bc))}
.kind-toggle button.active{background:hsl(var(--b1));color:hsl(var(--bc));box-shadow:0 1px 3px hsl(var(--n) / 0.08), 0 2px 8px hsl(var(--n) / 0.04)}
.kind-toggle.hidden{display:none}

.admin-only{display:none}
body.admin .admin-only{display:initial}
body.admin .admin-only.flex{display:flex}
body.admin .admin-only.actions{display:flex}

@media (max-width:768px){
  body{padding:18px 16px 80px}
  h1{font-size:24px}
}
@media (max-width:600px){
  body{padding:14px 12px 80px}
  .grid{grid-template-columns:1fr !important}
  .pager{flex-wrap:wrap}
  .expand-modal .expand-box{max-height:calc(100vh - 16px) !important;width:100vw !important;border-radius:20px 20px 0 0 !important}
  .expand-header{padding:14px 18px}
  .expand-header h3{font-size:16px}
  .modal-box{padding:22px}
  .face-thumb{width:80px !important;height:80px !important}
  .card-top{grid-template-columns:1fr 80px !important}
}

.stats{color:hsl(var(--bc) / 0.55);font-size:13px;margin-bottom:16px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin:24px 0}
.pager button{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;min-width:38px;height:38px;
  background:hsl(var(--b2));color:hsl(var(--bc));border:none;border-radius:999px;cursor:pointer;font-size:13px;font-weight:500;
  transition:all .2s ease-out}
.pager button:hover:not(:disabled){background:hsl(var(--b3));transform:translateY(-1px)}
.pager button:active:not(:disabled){transform:scale(.96)}
.pager button:disabled{opacity:.3;cursor:not-allowed}
.pager input{width:56px;height:38px;padding:6px;text-align:center;background:hsl(var(--b2));color:hsl(var(--bc));border:none;border-radius:12px;font-size:13px}
.pager input:focus{outline:2px solid hsl(var(--p) / 0.4);outline-offset:0}
.pager .info{color:hsl(var(--bc) / 0.55);font-size:13px;margin:0 6px}

/* ── Grid ────────────────────────────────────────────────────────────
   Explicit breakpoints so layouts feel deliberate, not auto-fill artifacts.
   Grid is centered horizontally within body via margin auto.
   align-items:start keeps cards top-aligned so taller cards don't
   stretch shorter neighbors and create "missing slot" visual artifacts.
*/
.grid{display:grid;gap:18px;margin-left:auto;margin-right:auto;align-items:start;width:100%}

/* admin cluster-card grid: rich content, wide cards
   14" MBP (≤1800 logical width)  → 3 cols
   27" / 32" external display     → 4 cols (user-requested)
   Ultra-wide (≥2600px)           → 5 cols */
body.admin .grid{grid-template-columns:1fr;max-width:560px}
@media (min-width:720px)  { body.admin .grid{grid-template-columns:repeat(2,1fr); max-width:1100px} }
@media (min-width:1200px) { body.admin .grid{grid-template-columns:repeat(3,1fr); max-width:1500px} }
@media (min-width:1900px) { body.admin .grid{grid-template-columns:repeat(4,1fr); max-width:1900px} }
@media (min-width:2600px) { body.admin .grid{grid-template-columns:repeat(5,1fr); max-width:2300px} }
@media (min-width:3200px) { body.admin .grid{grid-template-columns:repeat(6,1fr); max-width:2700px} }

/* viewer tile grid: small content (avatar + name), wider on big screens */
body:not(.admin) .grid{
  grid-template-columns:repeat(2,1fr);
  gap:22px;
  max-width:520px;
}
@media (min-width:600px)  { body:not(.admin) .grid{grid-template-columns:repeat(3,1fr); max-width:820px} }
@media (min-width:1200px) { body:not(.admin) .grid{grid-template-columns:repeat(4,1fr); max-width:1100px} }
@media (min-width:1700px) { body:not(.admin) .grid{grid-template-columns:repeat(5,1fr); max-width:1400px} }
@media (min-width:2200px) { body:not(.admin) .grid{grid-template-columns:repeat(6,1fr); max-width:1700px} }
@media (min-width:2800px) { body:not(.admin) .grid{grid-template-columns:repeat(7,1fr); max-width:2000px} }

body:not(.admin) .tile{background:transparent;border:none;border-radius:20px;padding:14px 8px;cursor:pointer;text-align:center;
  transition:transform .25s ease-out, background .2s ease-out;
  user-select:none;-webkit-tap-highlight-color:transparent}
body:not(.admin) .tile:hover{transform:translateY(-3px);background:hsl(var(--b2))}
body:not(.admin) .tile:active{transform:scale(.96)}
body:not(.admin) .tile .avatar{width:100%;aspect-ratio:1;border-radius:50%;object-fit:cover;background:hsl(var(--b2));
  display:block;margin:0 auto 12px;border:none;box-shadow:0 1px 3px hsl(var(--n) / 0.06), 0 4px 16px hsl(var(--n) / 0.06);
  transition:box-shadow .25s ease-out}
body:not(.admin) .tile:hover .avatar{box-shadow:0 4px 8px hsl(var(--n) / 0.10), 0 12px 28px hsl(var(--n) / 0.12)}
body:not(.admin) .tile .tname{font-size:15px;color:hsl(var(--bc));font-weight:500;line-height:1.3;word-break:break-word;letter-spacing:-0.01em}
body:not(.admin) .tile .tcount{color:hsl(var(--bc) / 0.45);font-size:12px;margin-top:4px}
@media (max-width:480px){
  body:not(.admin) .tile{padding:10px 4px}
  body:not(.admin) .tile .tname{font-size:14px}
}

/* ── List row (admin "list mode" for named clusters) ── */
.list{display:flex;flex-direction:column;gap:8px}
.list-row{display:grid;grid-template-columns:48px 90px 1fr 80px auto;align-items:center;gap:14px;
  background:hsl(var(--b2));border:none;border-radius:14px;padding:10px 16px;
  transition:transform .2s, box-shadow .2s, background .2s}
.list-row:hover{background:hsl(var(--b3) / 0.6);transform:translateY(-1px);box-shadow:0 2px 10px hsl(var(--n) / 0.06)}
.list-row .lr-thumb{width:40px;height:40px !important;border-radius:50%;object-fit:cover;flex-shrink:0}
.list-row .lr-id{color:hsl(var(--bc) / 0.45);font-size:12px;font-family:"SF Mono",ui-monospace,monospace}
.list-row .lr-name{color:hsl(var(--bc));font-weight:600;font-size:15px;cursor:text;padding:4px 8px;border-radius:8px;min-height:28px;transition:background .15s;letter-spacing:-0.01em}
.list-row .lr-name:hover{background:hsl(var(--b1) / 0.7)}
.list-row .lr-name-input{width:100%;padding:6px 10px;background:hsl(var(--b1));color:hsl(var(--bc));border:none;border-radius:8px;font-size:14px;outline:2px solid hsl(var(--p) / 0.4)}
.list-row .lr-count{color:hsl(var(--bc) / 0.55);font-size:13px;text-align:right}
.list-row .lr-actions{display:flex;gap:4px}
.list-row .lr-actions button{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:6px 12px;font-size:12px;font-weight:500;border-radius:999px;border:none;background:hsl(var(--b1));color:hsl(var(--bc) / 0.75);cursor:pointer;transition:all .2s ease-out}
.list-row .lr-actions button:hover{background:hsl(var(--b3));color:hsl(var(--bc));transform:translateY(-1px)}
.list-row .lr-actions button:active{transform:scale(.96)}

/* ── Cluster card (naming UI) ── */
.card{position:relative;background:hsl(var(--b2));border-radius:20px;border:none;overflow:hidden;
  transition:transform .25s ease-out, box-shadow .25s ease-out, background .2s;
  box-shadow:0 1px 3px hsl(var(--n) / 0.04)}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 16px hsl(var(--n) / 0.08), 0 1px 3px hsl(var(--n) / 0.04)}
.card.named{box-shadow:0 0 0 1.5px hsl(var(--p) / 0.5), 0 1px 3px hsl(var(--n) / 0.04)}
.card.named:hover{box-shadow:0 0 0 1.5px hsl(var(--p) / 0.6), 0 4px 16px hsl(var(--n) / 0.08)}
.card.cluster-selected{box-shadow:0 0 0 2px hsl(var(--wa)), 0 4px 16px hsl(var(--wa) / 0.18)}
.card.skipped{opacity:.5;background:hsl(var(--b2) / 0.5)}
.card.skipped .face-meta h3{color:hsl(var(--bc) / 0.45)}
.cluster-cb{position:absolute;top:10px;right:10px;width:24px;height:24px;accent-color:hsl(var(--p));
  cursor:pointer;z-index:5;background:hsl(var(--b1) / 0.9);border-radius:6px;padding:1px;
  backdrop-filter:blur(8px);box-shadow:0 1px 4px hsl(var(--n) / 0.1)}
#clusterSelectBtn.active{background:hsl(var(--p));color:hsl(var(--pc));box-shadow:0 2px 10px hsl(var(--p) / 0.25)}
.card-top{display:grid;grid-template-columns:1fr 100px;gap:16px;padding:18px 18px 14px}
.face-meta h3{color:hsl(var(--bc));font-size:17px;margin-bottom:4px;font-weight:600;letter-spacing:-0.015em}
.face-meta .count{color:hsl(var(--bc) / 0.55);font-size:13px}
.face-meta .named-label{color:hsl(var(--bc));font-weight:600;font-size:16px;margin-top:8px;letter-spacing:-0.015em}
.face-meta .merged-badge{display:inline-flex;align-items:center;gap:4px;margin-top:8px;padding:3px 10px;
  background:hsl(var(--a) / 0.15);color:hsl(var(--a));font-size:11px;border-radius:999px;font-weight:500}
.face-thumb{width:100px;height:100px !important;border-radius:50%;object-fit:cover;border:none;box-shadow:0 2px 8px hsl(var(--n) / 0.10);flex-shrink:0}
.card.named .face-thumb{box-shadow:0 0 0 2px hsl(var(--p) / 0.5), 0 2px 8px hsl(var(--n) / 0.10)}
.card.skipped .face-thumb{opacity:.6}

.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;padding:0}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;transition:opacity .15s}
.photo-grid img:hover{opacity:.85}

.expand-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;
  background:transparent;border-top:1px solid hsl(var(--b3) / 0.5);cursor:pointer;
  font-size:13px;color:hsl(var(--bc) / 0.7);transition:background .15s, color .15s;font-weight:500}
.expand-bar:hover{background:hsl(var(--b3) / 0.5);color:hsl(var(--bc))}

.expand-photos{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.expand-photos .thumb-wrap{position:relative}
.expand-photos img{width:100%;aspect-ratio:1;object-fit:cover;cursor:pointer;border-radius:6px}
.expand-photos .thumb-actions{position:absolute;top:4px;right:4px;display:flex;gap:4px;opacity:0;transition:opacity .15s}
.expand-photos .thumb-wrap:hover .thumb-actions{opacity:1}
.expand-photos .thumb-wrap.selectable img{cursor:pointer}
.expand-photos .thumb-wrap.selected img{opacity:.85}
.expand-photos .thumb-wrap.selected{outline:2.5px solid hsl(var(--p));outline-offset:-2.5px;border-radius:8px}
.expand-photos .thumb-wrap.selected::after{content:'';position:absolute;top:6px;left:6px;width:22px;height:22px;background:hsl(var(--p));border-radius:50%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'><polyline points='20 6 9 17 4 12'/></svg>");
  background-repeat:no-repeat;background-position:center;box-shadow:0 1px 4px hsl(var(--n) / 0.2)}
.expand-photos .thumb-actions button{width:28px;height:28px;border-radius:50%;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:white;padding:0;
  background:hsl(var(--n) / 0.7);backdrop-filter:blur(8px);transition:transform .15s, background .15s}
.expand-photos .thumb-actions button:hover{transform:scale(1.1)}
.expand-photos .thumb-actions button [data-lucide]{width:14px;height:14px;stroke-width:2.25}
.expand-photos .move-btn:hover{background:hsl(var(--su) / 0.95)}
.expand-photos .remove-btn:hover{background:hsl(var(--er) / 0.95)}
.expand-photos .thumb-btn:hover{background:hsl(var(--wa) / 0.95)}

.expand-tools{display:flex;gap:6px;padding:6px 0 14px;align-items:center;flex-wrap:wrap}
.expand-tools button{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;font-size:12px;font-weight:500;
  border-radius:999px;border:none;background:hsl(var(--b2));color:hsl(var(--bc) / 0.75);cursor:pointer;transition:all .2s ease-out}
.expand-tools button:hover{background:hsl(var(--b3));color:hsl(var(--bc))}
.expand-tools button:active{transform:scale(.96)}
.expand-tools button.active{background:hsl(var(--p));color:hsl(var(--pc))}
.expand-tools .hint{color:hsl(var(--bc) / 0.45);font-size:11px;margin-left:6px}

/* ── Floating action bar (multi-select context) ── */
.select-bar{display:none;position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:hsl(var(--b1) / 0.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid hsl(var(--b3) / 0.5);border-radius:999px;padding:10px 16px;
  box-shadow:0 8px 32px hsl(var(--n) / 0.16), 0 2px 8px hsl(var(--n) / 0.06);
  gap:8px;align-items:center;z-index:200}
.select-bar.active{display:flex;animation:selectBarSlideUp .3s ease-out}
@keyframes selectBarSlideUp{from{transform:translateX(-50%) translateY(20px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
.select-bar .count{color:hsl(var(--bc));font-weight:600;padding:0 8px;font-size:13px}
.select-bar button{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:999px;
  border:none;cursor:pointer;font-size:13px;font-weight:500;transition:all .2s ease-out}
.select-bar button:hover{transform:translateY(-1px)}
.select-bar button:active{transform:scale(.96)}
.select-bar .btn-go{background:hsl(var(--p));color:hsl(var(--pc))}
.select-bar .btn-go:hover{box-shadow:0 4px 12px hsl(var(--p) / 0.3)}
.select-bar .btn-cancel{background:transparent;color:hsl(var(--bc) / 0.75)}
.select-bar .btn-cancel:hover{background:hsl(var(--b3) / 0.6);color:hsl(var(--bc))}

/* ── Card action bar (rename / merge / skip etc.) ── */
.actions{display:flex;gap:6px;padding:12px 18px 16px;border-top:1px solid hsl(var(--b3) / 0.5);flex-wrap:wrap;align-items:center}
.actions input{flex:1;min-width:140px;padding:8px 12px;border:none;border-radius:10px;
  background:hsl(var(--b1));color:hsl(var(--bc));font-size:13px;transition:outline .15s}
.actions input:focus{outline:2px solid hsl(var(--p) / 0.4);outline-offset:0}
.btn{display:inline-flex;align-items:center;gap:5px;padding:8px 14px;border-radius:999px;cursor:pointer;
  font-size:13px;font-weight:500;border:none;transition:all .2s ease-out;line-height:1}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:scale(.96)}
.btn-save{background:hsl(var(--p));color:hsl(var(--pc));font-weight:600}
.btn-save:hover{box-shadow:0 2px 10px hsl(var(--p) / 0.3)}
.btn-edit{background:hsl(var(--b1));color:hsl(var(--bc) / 0.85)}
.btn-edit:hover{background:hsl(var(--b3))}
.btn-skip{background:hsl(var(--b1));color:hsl(var(--bc) / 0.6)}
.btn-skip:hover{background:hsl(var(--b3));color:hsl(var(--bc))}
.btn-merge{background:hsl(var(--b1));color:hsl(var(--a))}
.btn-merge:hover{background:hsl(var(--a) / 0.15)}
.btn-undo{background:hsl(var(--b1));color:hsl(var(--er) / 0.85)}
.btn-undo:hover{background:hsl(var(--er) / 0.12)}

/* ── Modals ── */
.modal{position:fixed;inset:0;background:hsl(var(--n) / 0.40);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);z-index:100;
  display:flex;justify-content:center;align-items:center;
  opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity .22s ease-out, visibility 0s linear .22s}
.modal.active{opacity:1;visibility:visible;pointer-events:auto;
  transition:opacity .22s ease-out, visibility 0s linear 0s}
.modal-box{background:hsl(var(--b1));padding:28px;border-radius:24px;max-width:480px;width:90%;
  border:none;box-shadow:0 24px 64px hsl(var(--n) / 0.20), 0 8px 24px hsl(var(--n) / 0.08);
  transform:scale(.96);transition:transform .22s cubic-bezier(0.2, 0.9, 0.3, 1.1)}
.modal.active .modal-box{transform:scale(1)}

.expand-modal{align-items:flex-start;padding:24px 0}
.expand-modal .expand-box{background:hsl(var(--b1));border:none;border-radius:24px;
  width:min(1400px,95vw);max-height:calc(100vh - 48px);display:flex;flex-direction:column;
  box-shadow:0 24px 64px hsl(var(--n) / 0.20), 0 8px 24px hsl(var(--n) / 0.08);
  transform:scale(.96);transition:transform .22s cubic-bezier(0.2, 0.9, 0.3, 1.1)}
.expand-modal.active .expand-box{transform:scale(1)}
.expand-header{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;
  border-bottom:1px solid hsl(var(--b3) / 0.5);flex-shrink:0}
.expand-header h3{color:hsl(var(--bc));font-size:18px;font-weight:600;letter-spacing:-0.015em}
.expand-header .meta{color:hsl(var(--bc) / 0.55);font-size:13px;margin-left:12px;font-weight:400}
.expand-header .close{display:inline-flex;align-items:center;justify-content:center;
  background:hsl(var(--b2));color:hsl(var(--bc) / 0.7);border:none;width:36px;height:36px;border-radius:50%;
  cursor:pointer;font-size:0;transition:all .2s ease-out}
.expand-header .close:hover{background:hsl(var(--b3));color:hsl(var(--bc))}
.expand-header .close:active{transform:scale(.92)}
.expand-header .close [data-lucide]{width:18px;height:18px}
.expand-body{padding:18px 24px 24px;overflow-y:auto;flex:1}

.self-hint{display:flex;align-items:center;gap:10px;background:hsl(var(--in) / 0.12);
  border:none;color:hsl(var(--in));padding:12px 16px;border-radius:14px;margin-bottom:16px;
  font-size:13px;line-height:1.55}
.self-hint [data-lucide]{flex-shrink:0;width:18px;height:18px}

.expand-modal .expand-photos{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.expand-modal .expand-photos .thumb-wrap img{border-radius:10px}
.expand-modal .removed-grid{grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px}

/* ── Year filter / sticky year header ── */
.year-filter{display:flex;gap:8px;align-items:center;padding:10px 0 14px;flex-wrap:wrap}
.year-filter select{padding:7px 12px;background:hsl(var(--b2));color:hsl(var(--bc));border:none;border-radius:10px;font-size:13px;cursor:pointer}
.year-filter .clear{padding:6px 12px;background:transparent;color:hsl(var(--bc) / 0.65);border:none;border-radius:999px;cursor:pointer;font-size:12px;transition:background .15s}
.year-filter .clear:hover{background:hsl(var(--b3))}
.year-section{margin-bottom:18px}
.year-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;
  background:hsl(var(--b3) / 0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:hsl(var(--bc));font-weight:600;border-radius:12px;cursor:pointer;margin-bottom:8px;font-size:14px;
  position:sticky;top:0;z-index:5;letter-spacing:-0.01em;
  box-shadow:0 1px 0 hsl(var(--n) / 0.04), 0 2px 8px hsl(var(--n) / 0.04);
  transition:background .15s, box-shadow .15s}
.year-header:hover{background:hsl(var(--b3));box-shadow:0 1px 0 hsl(var(--n) / 0.06), 0 4px 12px hsl(var(--n) / 0.06)}
.year-header .toggle{display:inline-flex;align-items:center;justify-content:center;
  width:24px;height:24px;border-radius:50%;color:hsl(var(--bc) / 0.55);transition:background .15s}
.year-header:hover .toggle{background:hsl(var(--bc) / 0.06)}
.year-header .toggle [data-lucide]{width:16px;height:16px}
/* Two-icon swap (no rotation): chevron-down when expanded, chevron-right when collapsed.
   Each <span class="toggle"> contains both icons; CSS shows only one. */
.year-header .toggle .icon-collapsed{display:none}
.year-section.collapsed .year-header .toggle .icon-expanded{display:none}
.year-section.collapsed .year-header .toggle .icon-collapsed{display:inline-flex}
.year-section.collapsed .year-body{display:none}

.modal-box h3{margin-bottom:18px;font-weight:600;color:hsl(var(--bc));font-size:18px;letter-spacing:-0.015em}
.modal-box input[type=text]{width:100%;padding:10px 14px;background:hsl(var(--b2));color:hsl(var(--bc));border:none;border-radius:12px;margin-bottom:10px;font-size:14px;transition:outline .15s}
.modal-box input[type=text]:focus{outline:2px solid hsl(var(--p) / 0.4);outline-offset:0}
.modal-box select{width:100%;padding:12px;margin-bottom:18px;background:hsl(var(--b2));color:hsl(var(--bc));border:none;border-radius:12px;max-height:300px;font-size:14px}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.spinner{text-align:center;padding:48px;color:hsl(var(--bc) / 0.45);font-size:13px}

.removed-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:12px 0}
.removed-grid .thumb-wrap{position:relative}
.removed-grid img{width:100%;aspect-ratio:1;object-fit:cover;opacity:.4;border-radius:8px}
.removed-grid .restore-btn{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;
  background:hsl(var(--n) / 0.7);backdrop-filter:blur(8px);color:white;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:transform .15s, background .15s}
.removed-grid .restore-btn:hover{transform:scale(1.1);background:hsl(var(--su) / 0.95)}
.removed-grid .restore-btn [data-lucide]{width:13px;height:13px;stroke-width:2.5}
</style>
</head>
<body>

<div class="userbar">
  <div><i data-lucide="user"></i> <span class="who" id="whoami"></span> <span id="role-tag"></span></div>
  <div>
    <a href="/admin" class="admin-only icon-only" title="管理"><i data-lucide="settings"></i></a>
    <button onclick="logout()"><i data-lucide="log-out"></i> 登出</button>
  </div>
</div>

<h1 id="mainTitle">家庭相簿</h1>
<div class="subtitle admin-only" id="subtitle"></div>

<!-- v0.6 shortcuts: jump to overview / memories -->
<div class="shortcuts">
  <a href="/overview" class="shortcut-card">
    <span class="icon"><i data-lucide="layout-grid"></i></span>
    <span class="text"><span class="title">總覽</span><span class="sub">所有照片，依時間排列</span></span>
    <i data-lucide="chevron-right" class="chev"></i>
  </a>
  <a href="/memories" class="shortcut-card">
    <span class="icon"><i data-lucide="sparkles"></i></span>
    <span class="text"><span class="title">回憶</span><span class="sub">那年今日、旅行、主題回顧</span></span>
    <i data-lucide="chevron-right" class="chev"></i>
  </a>
</div>

<!-- v0.6 today's-memories preview: 3 cards, populated by loadTodayMemories() -->
<section class="today-mem" id="todayMem" style="display:none">
  <div class="today-mem-head">
    <span class="label"><i data-lucide="sparkles"></i> 今日回憶</span>
    <a href="/memories" class="more">查看全部 <i data-lucide="chevron-right"></i></a>
  </div>
  <div class="today-mem-grid" id="todayMemGrid"></div>
</section>

<div class="kind-toggle" id="kindToggle">
  <button class="active" data-kind="face" onclick="setKind('face')"><i data-lucide="users"></i> 人臉</button>
  <button data-kind="pet" onclick="setKind('pet')"><i data-lucide="paw-print"></i> 寵物</button>
</div>

<div class="toolbar admin-only">
  <button class="active" data-filter="all" onclick="setFilter('all')">全部</button>
  <button data-filter="unnamed" onclick="setFilter('unnamed')">未命名</button>
  <button data-filter="named" onclick="setFilter('named')">已命名</button>
  <button data-filter="skipped" onclick="setFilter('skipped')">已略過</button>
  <button id="clusterSelectBtn" onclick="toggleClusterSelectMode()"><i data-lucide="square-mouse-pointer"></i> 多選</button>
  <button id="viewToggle" onclick="toggleView()" style="display:none;margin-left:14px"><i data-lucide="list"></i> 清單模式</button>
</div>

<!-- 多選動作列（沿用 .select-bar 樣式，獨立 id） -->
<div class="select-bar" id="clusterSelectBar">
  <span class="count">已選 <span id="clusterSelectCount">0</span> 個</span>
  <button class="btn-cancel" onclick="selectAllVisibleClusters()">全選</button>
  <button class="btn-cancel" onclick="clearClusterSelection()">取消</button>
  <button class="btn-go" onclick="openBatchMerge()"><i data-lucide="merge"></i> 合併到…</button>
  <button class="btn-cancel" onclick="batchSkip()"><i data-lucide="skip-forward"></i> 略過</button>
  <button class="btn-cancel" onclick="exitClusterSelectMode()">退出</button>
</div>

<div class="stats admin-only" id="stats"></div>

<div class="pager" id="pagerTop"></div>
<div class="grid" id="grid"></div>
<div class="spinner" id="spinner" style="display:none">載入中...</div>
<div class="pager" id="pagerBottom"></div>

<div class="modal" id="mergeModal">
  <div class="modal-box">
    <h3>合併到哪個群組？</h3>
    <input type="text" id="mergeFilter" placeholder="輸入名稱或 ID 過濾..." oninput="filterMergeOptions()">
    <select id="mergeTarget" size="10"></select>
    <div class="modal-actions">
      <button class="btn btn-skip" onclick="closeMerge()">取消</button>
      <button class="btn btn-save" onclick="confirmMerge()">合併</button>
    </div>
  </div>
</div>

<div class="modal expand-modal" id="expandModal" onclick="if(event.target===this)closeExpand()">
  <div class="expand-box">
    <div class="expand-header">
      <div>
        <h3 id="expandTitle"></h3>
        <span class="meta" id="expandMeta"></span>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button id="expandSelectBtn" class="admin-only btn btn-edit" onclick="if(openExpandFid)toggleSelectMode(openExpandFid)"><i data-lucide="square-mouse-pointer"></i> 多選</button>
        <button class="close" onclick="closeExpand()"><i data-lucide="x"></i></button>
      </div>
    </div>
    <div class="expand-body" id="expandBody"></div>
  </div>
</div>

<div class="select-bar" id="selectBar">
  <span class="count"><span id="selectCount">0</span> 張已選</span>
  <button class="btn-go" onclick="moveSelected()"><i data-lucide="arrow-right"></i> 移到別群</button>
  <button class="btn-cancel" onclick="exitSelectMode()">取消</button>
</div>

<div class="modal" id="moveModal">
  <div class="modal-box">
    <h3>把這張照片移到哪個群組？</h3>
    <div id="movePreview" style="text-align:center;margin-bottom:12px"></div>
    <input type="text" id="moveFilter" placeholder="輸入名稱或 ID 過濾..." oninput="filterMoveOptions()">
    <select id="moveTarget" size="10"></select>
    <div style="display:flex;gap:6px;align-items:center;margin-top:10px;padding:10px;background:hsl(var(--b2));border-radius:12px">
      <input type="text" id="newGroupName" placeholder="新群組名稱（可選）"
             style="flex:1;padding:8px 12px;background:hsl(var(--b1));color:hsl(var(--bc));border:none;border-radius:8px;font-size:13px"
             onkeydown="if(event.key==='Enter')moveToNew()">
      <button class="btn btn-merge" onclick="moveToNew()" title="建立新群組並把選的照片放進去"><i data-lucide="plus"></i> 移到新群組</button>
    </div>
    <div class="modal-actions" style="margin-top:12px">
      <button class="btn btn-skip" onclick="closeMove()">取消</button>
      <button class="btn btn-save" onclick="confirmMove()">移到既有群組</button>
    </div>
  </div>
</div>

<script>
let ITEMS = [];
let currentPage = 0;
let totalPages = 1;
let totalCount = 0;
let filter = 'all';
let viewMode = 'grid';  // 'grid' | 'list'，list 只有 named filter 下可用
let mergeSource = '';
let mergeSources = [];          // 多選合併用：>0 表示 batch 模式
let clusterSelectMode = false;
let selectedClusterIds = new Set();
let moveSource = '';   // 來源 cluster id
let movePath = '';     // 單張移動的圖片路徑（null 代表 batch）
let allClusters = [];  // 給合併/移動下拉用，按需 fetch
let openExpandFid = null;       // 目前 modal 展開的 cluster id（單一）
let openExpandMeta = null;      // {images:[{path,ts,year,month}], removed:[]}
let selectMode = null;          // 多選模式作用中的 cluster id
let selectedPaths = new Set();  // 已選中的照片路徑
let yearFilter = '';            // '' = 全部
let monthFilter = '';           // '' = 全部
let collapsedYears = new Set(); // 已摺疊（key = String(year) 或 '無日期'）
let materializedYears = new Set(); // 已 render 出 img DOM 的年份
let removedSectionCollapsed = true;   // 「已移除」區段預設折疊
let removedSectionMaterialized = false;
let unloadTimers = new Map();   // year -> setTimeout id（用於折疊後 TTL 釋放 DOM）
const UNLOAD_TTL_MS = 3 * 60 * 1000;  // 折疊超過 3 分鐘 → 移除 img DOM

// 初始化 user / role 顯示
document.getElementById('whoami').textContent = window.CURRENT_USER || '(未登入)';
document.getElementById('role-tag').textContent = window.IS_ADMIN ? '(admin)' : '(viewer · 唯讀)';
if(window.IS_ADMIN){ document.body.classList.add('admin'); }

// kind toggle 顯示邏輯
const kt = document.getElementById('kindToggle');
if(kt){
  const btnFace = kt.querySelector('[data-kind="face"]');
  const btnPet  = kt.querySelector('[data-kind="pet"]');
  // viewer：不分 face/pet，直接 kind=all，整個 toggle 隱藏
  if(!window.IS_ADMIN){
    window.KIND = 'all';
    kt.classList.add('hidden');
  } else {
    if(btnFace) btnFace.style.display = window.HAS_FACE ? '' : 'none';
    if(btnPet)  btnPet.style.display  = window.HAS_PET  ? '' : 'none';
    if(!window.HAS_FACE && !window.HAS_PET) kt.classList.add('hidden');
    if(!(window.HAS_FACE && window.HAS_PET)) kt.classList.add('hidden');
    // admin 預設 kind
    if(!window.HAS_FACE && window.HAS_PET){
      window.KIND = 'pet';
      if(btnPet) btnPet.classList.add('active');
      if(btnFace) btnFace.classList.remove('active');
    }
  }
}

function logout(){
  fetch('/api/logout',{method:'POST'}).then(()=>location.href='/login');
}

loadStats();
loadPage(0);
loadTodayMemories();

// Today's memories preview: pick 3 from /api/memories, link each to /memories#<id>
function loadTodayMemories(){
  const sec  = document.getElementById('todayMem');
  const grid = document.getElementById('todayMemGrid');
  if(!sec || !grid) return;
  const TYPE = {
    on_this_day:{i:'calendar-heart',l:'那年今日'},  trip:{i:'map-pin',l:'旅行'},
    person:{i:'user',l:'人物'},  pet:{i:'paw-print',l:'寵物'},
    place:{i:'map-pin',l:'地點'},  season:{i:'sparkles',l:'季節'},
    weekend:{i:'calendar-heart',l:'週末'},  topic:{i:'image',l:'主題'},
  };
  fetch('/api/memories').then(r=>r.json()).then(d=>{
    const cards = (d && d.cards) || [];
    if(!cards.length) return;
    // Shuffle then pick 3 — different selection each page load (per spec).
    const pool = cards.slice();
    for(let i = pool.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    const picks = pool.slice(0, 3);
    grid.innerHTML = picks.map(c => {
      const t = TYPE[c.type] || {i:'image',l:'回憶'};
      const cover = c.cover ? `/img_thumb/${encodeURI(c.cover)}?w=700` : '';
      const href  = `/memories#${encodeURIComponent(c.id)}`;
      return `<a class="today-mem-card" href="${href}" style="background-image:url('${cover}')">
        <div class="meta">
          <span class="tag"><i data-lucide="${t.i}"></i> ${t.l}</span>
          <div class="t">${escapeHtmlSimple(c.title || '')}</div>
          <div class="s">${escapeHtmlSimple(c.subtitle || '')}</div>
        </div>
      </a>`;
    }).join('');
    sec.style.display = 'block';
    window.refreshIcons && window.refreshIcons();
  }).catch(()=>{ /* silent — carousel is non-critical */ });
}

function escapeHtmlSimple(s){
  return String(s||'').replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}

// Esc 關 modal
document.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  if(document.getElementById('expandModal').classList.contains('active')){
    closeExpand();
  } else if(document.getElementById('moveModal').classList.contains('active')){
    closeMove();
  } else if(document.getElementById('mergeModal').classList.contains('active')){
    closeMerge();
  }
});

// kind toggle
function setKind(k){
  if(k === window.KIND) return;
  if(k === 'pet' && !window.HAS_PET){ return; }
  if(k === 'face' && !window.HAS_FACE){ return; }
  window.KIND = k;
  document.querySelectorAll('.kind-toggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.kind === k);
  });
  // 切 kind 時清掉現有狀態並重載
  ITEMS = [];
  currentPage = 0;
  document.getElementById('grid').innerHTML = '';
  loadStats();
  loadPage(0);
}

function loadStats(){
  fetch(kq('/api/stats')).then(r=>r.json()).then(d=>{
    document.getElementById('subtitle').textContent =
      `共 ${d.total} 個原始群組，合併後 ${d.displayed} 個可顯示`;
    document.getElementById('stats').innerHTML =
      `<span style="color:hsl(var(--p));font-weight:600">${d.named}</span> 已命名 · ` +
      `<span style="color:hsl(var(--bc) / 0.5)">${d.skipped}</span> 已略過 · ` +
      `<span style="color:hsl(var(--a));font-weight:600">${d.merges}</span> 已合併`;
  });
}

function loadPage(page){
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('grid').innerHTML = '';
  return fetch(kq(`/api/page?page=${page}&filter=${filter}`)).then(r=>r.json()).then(d=>{
    ITEMS = d.items;
    currentPage = d.page;
    totalPages = d.total_pages;
    totalCount = d.total;
    renderGrid();
    renderPager();
    document.getElementById('spinner').style.display = 'none';
    // 如果 expand modal 還開著，刷新內容
    if(openExpandFid) renderExpandBody();
  });
}

function renderPager(){
  const html = `
    <button onclick="loadPage(0)" ${currentPage===0?'disabled':''} title="第一頁"><i data-lucide="chevrons-left"></i></button>
    <button onclick="loadPage(${currentPage-1})" ${currentPage===0?'disabled':''} title="上一頁"><i data-lucide="chevron-left"></i></button>
    <span class="info">
      <input type="number" min="1" max="${totalPages}" value="${currentPage+1}"
             onchange="loadPage(this.value-1)"> / ${totalPages} 頁
      · 共 ${totalCount} 筆</span>
    <button onclick="loadPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''} title="下一頁"><i data-lucide="chevron-right"></i></button>
    <button onclick="loadPage(${totalPages-1})" ${currentPage>=totalPages-1?'disabled':''} title="最後一頁"><i data-lucide="chevrons-right"></i></button>
  `;
  document.getElementById('pagerTop').innerHTML = html;
  document.getElementById('pagerBottom').innerHTML = html;
  window.refreshIcons && window.refreshIcons();
}

function renderGrid(){
  const grid = document.getElementById('grid');
  if(viewMode === 'list' && filter === 'named'){
    grid.className = 'list';
    grid.innerHTML = ITEMS.map(c => renderListRow(c)).join('');
  } else {
    grid.className = 'grid';
    grid.innerHTML = ITEMS.map(c => renderCard(c)).join('');
  }
  window.refreshIcons && window.refreshIcons();
}

function renderListRow(c){
  const fid = c.id;
  const nameClick = window.IS_ADMIN ? `onclick="editNameInline('${fid}')"` : '';
  const actions = window.IS_ADMIN ? `
    <div class="lr-actions">
      <button onclick="editNameInline('${fid}')" title="改名"><i data-lucide="pencil"></i></button>
      <button onclick="openMerge('${fid}')" title="合併"><i data-lucide="merge"></i></button>
      <button onclick="undoAction('${fid}')" title="取消命名"><i data-lucide="undo-2"></i></button>
    </div>` : '<div></div>';
  return `
    <div class="list-row" id="row_${fid}">
      <img class="lr-thumb" src="${thumbUrl(fid, c.thumb_v, c.kind)}" onerror="this.style.visibility='hidden'">
      <div class="lr-id">${fid}</div>
      <div class="lr-name" id="name_${fid}" ${nameClick}>${c.name}</div>
      <div class="lr-count">${c.count} 張</div>
      ${actions}
    </div>
  `;
}

function editNameInline(fid){
  const c = ITEMS.find(x=>x.id===fid);
  if(!c) return;
  const cell = document.getElementById('name_'+fid);
  if(!cell) return;
  const current = c.name || '';
  cell.innerHTML = `<input class="lr-name-input" id="inp_${fid}" value="${current.replace(/"/g,'&quot;')}"
    onblur="commitInlineName('${fid}')"
    onkeydown="if(event.key==='Enter')commitInlineName('${fid}');else if(event.key==='Escape')cancelInlineName('${fid}')">`;
  const inp = document.getElementById('inp_'+fid);
  inp.focus();
  inp.select();
}

function commitInlineName(fid){
  const inp = document.getElementById('inp_'+fid);
  if(!inp) return;
  const v = inp.value.trim();
  const c = ITEMS.find(x=>x.id===fid);
  if(!c) return;
  if(!v){ cancelInlineName(fid); return; }
  if(v === c.name){ cancelInlineName(fid); return; }
  post('/api/name',{face_id:fid,name:v}).then(()=>{
    c.name = v;
    document.getElementById('name_'+fid).textContent = v;
    loadStats();
  });
}

function cancelInlineName(fid){
  const c = ITEMS.find(x=>x.id===fid);
  if(!c) return;
  const cell = document.getElementById('name_'+fid);
  if(cell) cell.textContent = c.name || '';
}

function toggleView(){
  viewMode = viewMode === 'grid' ? 'list' : 'grid';
  document.getElementById('viewToggle').innerHTML =
    viewMode === 'list'
      ? '<i data-lucide="layout-grid"></i> 圖片模式'
      : '<i data-lucide="list"></i> 清單模式';
  renderGrid();
}

// ---- 多選合併 ----
function toggleClusterSelectMode(){
  clusterSelectMode = !clusterSelectMode;
  if(!clusterSelectMode){ selectedClusterIds.clear(); }
  document.getElementById('clusterSelectBtn').classList.toggle('active', clusterSelectMode);
  document.getElementById('clusterSelectBar').classList.toggle('active', clusterSelectMode);
  updateClusterSelectCount();
  renderGrid();
}
function exitClusterSelectMode(){ clusterSelectMode = false; selectedClusterIds.clear(); toggleClusterSelectMode(); /* second toggle re-applies; cheap */ }
function clearClusterSelection(){ selectedClusterIds.clear(); updateClusterSelectCount(); renderGrid(); }
function selectAllVisibleClusters(){
  ITEMS.forEach(c => selectedClusterIds.add(c.id));
  updateClusterSelectCount();
  renderGrid();
}
function toggleClusterSelected(fid){
  if(selectedClusterIds.has(fid)) selectedClusterIds.delete(fid);
  else selectedClusterIds.add(fid);
  updateClusterSelectCount();
  // 只重畫該卡片，避免整頁重 render
  const card = document.getElementById('card_' + fid);
  if(card) card.classList.toggle('cluster-selected', selectedClusterIds.has(fid));
  const cb = document.getElementById('cb_' + fid);
  if(cb) cb.checked = selectedClusterIds.has(fid);
}
function updateClusterSelectCount(){
  const el = document.getElementById('clusterSelectCount');
  if(el) el.textContent = selectedClusterIds.size;
}
function openBatchMerge(){
  if(selectedClusterIds.size === 0){ alert('請先勾選 cluster'); return; }
  mergeSources = Array.from(selectedClusterIds);
  document.getElementById('mergeFilter').value='';
  fetch(kq('/api/clusters')).then(r=>r.json()).then(list=>{
    // 目標不能是已選中的任何一個
    allClusters = list.filter(c => !selectedClusterIds.has(c.id));
    renderMergeOptions(allClusters);
    document.getElementById('mergeModal').classList.add('active');
    setTimeout(()=>document.getElementById('mergeFilter').focus(), 50);
  });
}

function batchSkip(){
  if(selectedClusterIds.size === 0){ alert('請先勾選 cluster'); return; }
  const ids = Array.from(selectedClusterIds);
  if(!confirm(`確定要把 ${ids.length} 個 cluster 都標為「略過」？`)) return;
  post('/api/skip-batch', {face_ids: ids}).then(r => r.json()).then(d => {
    // 退出多選 + 重載
    clusterSelectMode = false;
    selectedClusterIds.clear();
    document.getElementById('clusterSelectBtn').classList.remove('active');
    document.getElementById('clusterSelectBar').classList.remove('active');
    loadStats();
    loadPage(currentPage);
  });
}

function renderCard(c){
  const fid = c.id;
  // viewer：簡化成大頭像 + 名字的 tile，整塊可點 → openExpand
  if(!window.IS_ADMIN){
    const label = c.name || fid;
    return `
      <div class="tile" onclick="openExpand('${fid}')" role="button" tabindex="0"
           onkeydown="if(event.key==='Enter'||event.key===' ')openExpand('${fid}')">
        <img class="avatar" src="${thumbUrl(fid, c.thumb_v, c.kind)}" alt="${label.replace(/"/g,'&quot;')}" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="tname">${label}</div>
      </div>`;
  }
  const isNamed = !!c.name;
  const isSkipped = !!c.skipped;
  const isSelected = clusterSelectMode && selectedClusterIds.has(fid);
  const cls = 'card' + (isNamed?' named':'') + (isSkipped?' skipped':'') + (isSelected?' cluster-selected':'');

  // 多選模式：整張卡片 click 切換選取（覆蓋掉其它互動）
  const cardClickHandler = clusterSelectMode
    ? `onclick="toggleClusterSelected('${fid}')"`
    : '';
  const selectCheckbox = clusterSelectMode
    ? `<input type="checkbox" id="cb_${fid}" class="cluster-cb" ${isSelected?'checked':''}
              onclick="event.stopPropagation();toggleClusterSelected('${fid}')">`
    : '';

  const previewCount = Math.min(Math.max(6, c.images.length), 8);
  const previewImgs = c.images.slice(0,previewCount).map(img=>
    `<img src="/img_thumb/${img}?w=200" loading="lazy" decoding="async"
          onclick="window.open('/image/${img}')">`
  ).join('');

  let actions = '';
  // 多選模式下隱藏每張卡的 action（避免誤點）
  if(window.IS_ADMIN && !clusterSelectMode){
    if(isSkipped){
      actions = `<span style="color:hsl(var(--bc) / 0.45);font-size:13px">已略過</span>
        <button class="btn btn-edit" onclick="toggleSkip('${fid}')"><i data-lucide="undo-2"></i> 恢復</button>`;
    } else if(isNamed){
      actions = `
        <button class="btn btn-edit" onclick="editName('${fid}')"><i data-lucide="pencil"></i> 改名</button>
        <button class="btn btn-undo" onclick="undoAction('${fid}')"><i data-lucide="undo-2"></i> 取消命名</button>
        <button class="btn btn-merge" onclick="openMerge('${fid}')"><i data-lucide="merge"></i> 合併</button>
      `;
    } else {
      actions = `
        <input type="text" id="inp_${fid}" placeholder="輸入名稱..." onkeydown="if(event.key==='Enter')saveName('${fid}')">
        <button class="btn btn-save" onclick="saveName('${fid}')" title="儲存"><i data-lucide="check"></i></button>
        <button class="btn btn-skip" onclick="toggleSkip('${fid}')"><i data-lucide="skip-forward"></i> 略過</button>
        <button class="btn btn-merge" onclick="openMerge('${fid}')"><i data-lucide="merge"></i> 合併</button>
      `;
    }
  }

  const badges = [];
  if((c.merged_from||[]).length > 0)
    badges.push(`<div class="merged-badge"><i data-lucide="merge"></i> 已合併 ${c.merged_from.length} 群</div>`);
  if(c.moved_in_count > 0)
    badges.push(`<div class="merged-badge" style="background:hsl(var(--su) / 0.15);color:hsl(var(--su))"><i data-lucide="log-in"></i> 移入 ${c.moved_in_count} 張</div>`);
  if(c.moved_away_count > 0)
    badges.push(`<div class="merged-badge" style="background:hsl(var(--wa) / 0.15);color:hsl(var(--wa))"><i data-lucide="log-out"></i> 移出 ${c.moved_away_count} 張</div>`);
  const mergedBadge = badges.join('');

  return `
    <div class="${cls}" id="card_${fid}" ${cardClickHandler}>
      ${selectCheckbox}
      <div class="card-top">
        <div class="face-meta">
          <h3>${c.name || fid}</h3>
          ${c.name ? `<div style="color:hsl(var(--bc) / 0.4);font-size:11px;font-family:'SF Mono',ui-monospace,monospace;margin-top:2px">${fid}</div>` : ''}
          <div class="count">${c.count} 張${c.count!==c.original_count?' (原 '+c.original_count+')':''}</div>
          ${mergedBadge}
        </div>
        <img class="face-thumb" src="${thumbUrl(fid, c.thumb_v, c.kind)}" onerror="this.style.display='none'">
      </div>
      <div class="photo-grid">${previewImgs}</div>
      <div class="expand-bar" onclick="event.stopPropagation();openExpand('${fid}')">
        <span>展開查看全部 ${c.count} 張</span>
        <i data-lucide="arrow-up-right"></i>
      </div>
      <div class="actions">${actions}</div>
    </div>
  `;
}

// Request token + AbortController guard against the modal race where the
// user opens A, closes before A finishes loading, then opens B — without
// these, A's old response can leak in and stamp stale title/photos.
let _expandToken = 0;
let _expandAbort = null;

function openExpand(fid){
  // Bump the token AND abort any prior in-flight fetch — the old .then() will
  // see a mismatched token and bail out before touching DOM or state.
  _expandToken++;
  const myToken = _expandToken;
  if (_expandAbort) { try { _expandAbort.abort(); } catch (_e) {} }
  _expandAbort = new AbortController();

  openExpandFid = fid;
  openExpandMeta = null;
  yearFilter = '';
  monthFilter = '';
  collapsedYears.clear();
  materializedYears.clear();
  removedSectionCollapsed = true;
  removedSectionMaterialized = false;
  for(const t of unloadTimers.values()) clearTimeout(t);
  unloadTimers.clear();
  if(selectMode && selectMode !== fid){
    selectMode = null;
    selectedPaths.clear();
    renderSelectBar();
  }
  // Clear stale header text so users don't see the PREVIOUS person's name
  // hovering above the spinner while the new fetch is in flight.
  document.getElementById('expandTitle').textContent = '';
  document.getElementById('expandMeta').textContent = '';
  document.getElementById('expandBody').innerHTML = '<div class="spinner">載入中…</div>';
  document.getElementById('expandModal').classList.add('active');
  // 用 item 自己的 kind（混合模式下必要），fallback 到 window.KIND
  const it = ITEMS.find(x => x.id === fid);
  const itemKind = (it && it.kind) || (window.KIND === 'all' ? 'face' : window.KIND);
  fetch(
    `/api/cluster_meta?fid=${encodeURIComponent(fid)}&kind=${encodeURIComponent(itemKind)}`,
    { signal: _expandAbort.signal }
  ).then(r=>r.json()).then(meta=>{
    // Two guards: token (handles same-fid re-click) and openExpandFid (handles
    // close-then-open-different). Either failing means a NEWER request is
    // already in flight or the modal was closed — drop this response silently.
    if (myToken !== _expandToken || openExpandFid !== fid) return;
    openExpandMeta = meta;
    // 預設：只展開最新年度，其餘折疊。「無日期」也預設折疊。
    const yearSet = new Set();
    let hasUndated = false;
    for(const x of meta.images){
      if(x.year) yearSet.add(String(x.year));
      else hasUndated = true;
    }
    const ys = [...yearSet].sort((a,b)=>Number(b)-Number(a));
    const latest = ys[0];
    collapsedYears = new Set(ys.filter(y => y !== latest));
    if(hasUndated) collapsedYears.add('無日期');
    materializedYears = new Set(latest ? [latest] : []);
    renderExpandBody();
  }).catch(err => {
    // AbortError is the expected path when user opens a different cluster;
    // swallow it. Real network errors surface in the spinner area.
    if (err && err.name === 'AbortError') return;
    if (myToken === _expandToken) {
      document.getElementById('expandBody').innerHTML =
        '<div class="spinner" style="color:hsl(var(--er))">載入失敗：' + (err && err.message ? err.message : err) + '</div>';
    }
  });
}

function closeExpand(){
  document.getElementById('expandModal').classList.remove('active');
  openExpandFid = null;
  openExpandMeta = null;
  collapsedYears.clear();
  materializedYears.clear();
  removedSectionCollapsed = true;
  removedSectionMaterialized = false;
  for(const t of unloadTimers.values()) clearTimeout(t);
  unloadTimers.clear();
  if(selectMode){
    selectMode = null;
    selectedPaths.clear();
    renderSelectBar();
  }
}

function renderExpandBody(){
  if(!openExpandFid || !openExpandMeta) return;
  const c = ITEMS.find(x=>x.id===openExpandFid);
  if(!c){ closeExpand(); return; }
  const fid = c.id;
  const inSelect = selectMode === fid;

  // viewer 只顯示名字（不露 face_id），admin 則同時顯示 ID 方便除錯
  document.getElementById('expandTitle').textContent =
    window.IS_ADMIN ? (c.name ? `${c.name}  (${fid})` : fid)
                    : (c.name || '');
  // viewer 不顯示「(原 N)」避免暴露被擋掉的照片數
  document.getElementById('expandMeta').textContent =
    window.IS_ADMIN && c.count !== c.original_count
      ? `${c.count} 張 (原 ${c.original_count})`
      : `${c.count} 張`;

  // 套 filter
  const allItems = openExpandMeta.images || [];
  const filtered = allItems.filter(x => {
    if(yearFilter !== '' && String(x.year||'') !== String(yearFilter)) return false;
    if(monthFilter !== '' && String(x.month||'') !== String(monthFilter)) return false;
    return true;
  });

  // 取得可選年份（從未過濾的清單）
  const yearSet = new Set();
  for(const x of allItems) if(x.year) yearSet.add(x.year);
  const years = [...yearSet].sort((a,b)=>b-a);
  const yearOptions = years.map(y => `<option value="${y}" ${String(y)===String(yearFilter)?'selected':''}>${y}</option>`).join('');
  const monthOptions = Array.from({length:12},(_,i)=>i+1).map(m =>
    `<option value="${m}" ${String(m)===String(monthFilter)?'selected':''}>${m} 月</option>`).join('');

  // header 多選按鈕的狀態同步
  const headerBtn = document.getElementById('expandSelectBtn');
  if(headerBtn){
    headerBtn.innerHTML = inSelect
      ? '<i data-lucide="check"></i> 多選中'
      : '<i data-lucide="square-mouse-pointer"></i> 多選';
    headerBtn.classList.toggle('btn-save', inSelect);
    headerBtn.classList.toggle('btn-edit', !inSelect);
  }
  const tools = `
    ${inSelect ? '<div class="expand-tools"><span class="hint">點縮圖切換選取；底部 bar 操作</span></div>' : ''}
    <div class="year-filter">
      <span style="color:hsl(var(--bc) / 0.55);font-size:13px">篩選</span>
      <select onchange="yearFilter=this.value; renderExpandBody();">
        <option value="">全部年份</option>
        ${yearOptions}
        ${allItems.some(x=>!x.year) ? `<option value="null" ${yearFilter==='null'?'selected':''}>無日期</option>` : ''}
      </select>
      <select onchange="monthFilter=this.value; renderExpandBody();">
        <option value="">全部月份</option>
        ${monthOptions}
      </select>
      ${(yearFilter||monthFilter) ? '<button class="clear" onclick="yearFilter=\'\';monthFilter=\'\';renderExpandBody();">清除</button>' : ''}
      <span style="color:hsl(var(--bc) / 0.55);font-size:13px;margin-left:auto">顯示 ${filtered.length} / ${allItems.length}</span>
    </div>`;

  // 按年分組（同年內已按 ts desc），key 統一為 string
  const byYear = new Map();
  for(const x of filtered){
    const key = String(x.year || '無日期');
    if(!byYear.has(key)) byYear.set(key, []);
    byYear.get(key).push(x);
  }
  const yearKeys = [...byYear.keys()].sort((a,b)=>{
    if(a==='無日期') return 1; if(b==='無日期') return -1;
    return Number(b) - Number(a);
  });

  // 是否是當前 user 自己的 cluster（給 viewer 開放「自選頭像」）
  const isOwnIdentity = !!window.IDENTITY && fid === window.IDENTITY;

  function renderThumb(x){
    const img = x.path;
    const safeImg = img.replace(/'/g,"\'");
    const isSel = inSelect && selectedPaths.has(img);
    const wrapCls = 'thumb-wrap' + (inSelect?' selectable':'') + (isSel?' selected':'');
    const imgClick = inSelect
      ? `onclick="toggleThumbSelect('${fid}','${safeImg}')"`
      : `onclick="window.open('/image/${img}')" style="cursor:pointer"`;
    let actions = '';
    if(!inSelect){
      if(window.IS_ADMIN){
        actions = `<div class="thumb-actions">
          <button class="thumb-btn" onclick="event.stopPropagation();setAsThumb('${fid}','${safeImg}')" title="設為群組特寫照"><i data-lucide="star"></i></button>
          <button class="move-btn" onclick="event.stopPropagation();openMove('${fid}','${safeImg}')" title="移到別群"><i data-lucide="arrow-right"></i></button>
          <button class="remove-btn" onclick="event.stopPropagation();removeImg('${fid}','${safeImg}')" title="移除"><i data-lucide="x"></i></button>
        </div>`;
      } else if(isOwnIdentity){
        // viewer 在自己的 cluster：只能挑頭像，不能移動 / 移除
        actions = `<div class="thumb-actions">
          <button class="thumb-btn" onclick="event.stopPropagation();setAsThumb('${fid}','${safeImg}')" title="設為我的頭像"><i data-lucide="star"></i></button>
        </div>`;
      }
    }
    return `<div class="${wrapCls}" data-thumb="${fid}|${img}">
      <img src="/img_thumb/${img}?w=300" loading="lazy" decoding="async" ${imgClick}>
      ${actions}
    </div>`;
  }

  const sections = yearKeys.map(y => {
    const items = byYear.get(y);
    const collapsed = collapsedYears.has(y);
    // Materialize only if expanded OR previously expanded and TTL still alive
    let materialized = materializedYears.has(y);
    // 防呆：展開但還沒 materialize → 自動補
    if(!collapsed && !materialized){ materializedYears.add(y); materialized = true; }
    const bodyHtml = materialized
      ? `<div class="expand-photos">${items.map(renderThumb).join('')}</div>`
      : `<div style="color:hsl(var(--bc) / 0.45);font-size:12px;padding:8px 4px">點選展開以載入</div>`;
    return `<div class="year-section ${collapsed?'collapsed':''}" data-year="${y}">
      <div class="year-header" onclick="toggleYear('${y}')">
        <span>${y} <span style="color:hsl(var(--bc) / 0.45);font-weight:400;font-size:12px">(${items.length} 張)</span></span>
        <span class="toggle">
          <i data-lucide="chevron-down" class="icon-expanded"></i>
          <i data-lucide="chevron-right" class="icon-collapsed"></i>
        </span>
      </div>
      <div class="year-body">${bodyHtml}</div>
    </div>`;
  }).join('');

  // viewer 不顯示「已移除」區段（管理用，與一般瀏覽無關）
  const removed = window.IS_ADMIN ? (openExpandMeta.removed || []) : [];
  let removedSection = '';
  if(removed.length > 0){
    const collapsed = removedSectionCollapsed;
    let mat = removedSectionMaterialized;
    if(!collapsed && !mat){ removedSectionMaterialized = true; mat = true; }
    const removedImgs = removed.map(x =>
      `<div class="thumb-wrap">
        <img src="/img_thumb/${x.path}?w=200" loading="lazy" decoding="async">
        <button class="restore-btn" onclick="restoreImg('${fid}','${x.path.replace(/'/g,"\'")}')" title="恢復"><i data-lucide="undo-2"></i></button>
      </div>`
    ).join('');
    const body = mat
      ? `<div class="removed-grid">${removedImgs}</div>`
      : `<div style="color:hsl(var(--bc) / 0.45);font-size:12px;padding:8px 4px">點選展開以載入</div>`;
    removedSection = `<div class="year-section ${collapsed?'collapsed':''}" data-removed="1" style="margin-top:18px">
      <div class="year-header" style="background:hsl(var(--er) / 0.10);color:hsl(var(--er))" onclick="toggleRemovedSection()">
        <span>已移除 <span style="color:hsl(var(--bc) / 0.45);font-weight:400;font-size:12px">(${removed.length} 張)</span></span>
        <span class="toggle">
          <i data-lucide="chevron-down" class="icon-expanded"></i>
          <i data-lucide="chevron-right" class="icon-collapsed"></i>
        </span>
      </div>
      <div class="year-body">${body}</div>
    </div>`;
  }

  // 自己的 cluster：顯示挑頭像的提示橫幅
  const selfHint = (isOwnIdentity && !window.IS_ADMIN)
    ? `<div class="self-hint"><i data-lucide="info"></i> 點任一張照片右上的星星可設為你的頭像（其他人看你也會用這張）</div>`
    : '';

  document.getElementById('expandBody').innerHTML = `${selfHint}${tools}${sections}${removedSection}`;
  window.refreshIcons && window.refreshIcons();
}

function toggleRemovedSection(){
  if(removedSectionCollapsed){
    removedSectionCollapsed = false;
    removedSectionMaterialized = true;
  } else {
    removedSectionCollapsed = true;
    // TTL：3 min 後若仍 collapsed → 釋放 DOM
    setTimeout(()=>{
      if(!openExpandFid) return;
      if(!removedSectionCollapsed) return;
      removedSectionMaterialized = false;
      renderExpandBody();
    }, UNLOAD_TTL_MS);
  }
  renderExpandBody();
}

function toggleYear(y){
  y = String(y);
  if(collapsedYears.has(y)){
    // 展開：取消預定的 unload + materialize（若尚未）
    collapsedYears.delete(y);
    if(unloadTimers.has(y)){ clearTimeout(unloadTimers.get(y)); unloadTimers.delete(y); }
    materializedYears.add(y);
  } else {
    // 折疊：留 DOM、但 TTL 過後釋放
    collapsedYears.add(y);
    if(unloadTimers.has(y)) clearTimeout(unloadTimers.get(y));
    const t = setTimeout(()=>{
      if(!openExpandFid) return;
      if(!collapsedYears.has(y)) return;  // 已被重新展開
      materializedYears.delete(y);
      unloadTimers.delete(y);
      renderExpandBody();
    }, UNLOAD_TTL_MS);
    unloadTimers.set(y, t);
  }
  renderExpandBody();
}

function refreshExpandMeta(){
  if(!openExpandFid) return Promise.resolve();
  const it = ITEMS.find(x => x.id === openExpandFid);
  const itemKind = (it && it.kind) || (window.KIND === 'all' ? 'face' : window.KIND);
  return fetch(`/api/cluster_meta?fid=${encodeURIComponent(openExpandFid)}&kind=${encodeURIComponent(itemKind)}`)
    .then(r=>r.json()).then(meta=>{
      if(openExpandFid){ openExpandMeta = meta; renderExpandBody(); }
    });
}

function toggleSelectMode(fid){
  if(selectMode === fid){
    selectMode = null;
    selectedPaths.clear();
  } else {
    selectMode = fid;
    selectedPaths.clear();
  }
  renderExpandBody();
  renderSelectBar();
}

function exitSelectMode(){
  selectMode = null;
  selectedPaths.clear();
  if(openExpandFid) renderExpandBody();
  renderSelectBar();
}

function toggleThumbSelect(fid, img){
  if(selectMode !== fid) return;
  if(selectedPaths.has(img)) selectedPaths.delete(img);
  else selectedPaths.add(img);
  // 只更新該縮圖 class，不重渲整個 grid
  const el = document.querySelector(`[data-thumb="${fid}|${img}"]`);
  if(el) el.classList.toggle('selected', selectedPaths.has(img));
  renderSelectBar();
}

function renderSelectBar(){
  const bar = document.getElementById('selectBar');
  if(selectedPaths.size === 0){
    bar.classList.remove('active');
    return;
  }
  bar.classList.add('active');
  document.getElementById('selectCount').textContent = selectedPaths.size;
}

function moveSelected(){
  if(!selectMode || selectedPaths.size === 0) return;
  moveSource = selectMode;
  movePath = null;  // null = batch
  document.getElementById('moveFilter').value = '';
  const ngn = document.getElementById('newGroupName'); if(ngn) ngn.value = '';
  document.getElementById('movePreview').innerHTML =
    `<div style="color:hsl(var(--bc));font-size:15px;font-weight:600">批次移動 ${selectedPaths.size} 張</div>
     <div style="color:hsl(var(--bc) / 0.55);font-size:12px;margin-top:4px">來自 ${moveSource}</div>`;
  fetch(kq('/api/clusters')).then(r=>r.json()).then(list=>{
    allClusters = list.filter(c=>c.id !== moveSource);
    renderMoveOptions(allClusters);
    document.getElementById('moveModal').classList.add('active');
    setTimeout(()=>document.getElementById('moveFilter').focus(),50);
  });
}

function saveName(fid){
  const inp = document.getElementById('inp_'+fid);
  if(!inp||!inp.value.trim()) return;
  post('/api/name',{face_id:fid,name:inp.value.trim()}).then(()=>{
    loadStats(); loadPage(currentPage);
  });
}

function editName(fid){
  const c = ITEMS.find(x=>x.id===fid);
  if(!c) return;
  const current = c.name;
  // 簡化：直接清空名稱、重渲染、focus 輸入框
  c.name = '';
  renderGrid();
  setTimeout(()=>{
    const inp=document.getElementById('inp_'+fid);
    if(inp){inp.value=current; inp.focus(); inp.select();}
  },30);
}

function undoAction(fid){
  post('/api/name',{face_id:fid,name:''}).then(()=>{
    loadStats(); loadPage(currentPage);
  });
}

function toggleSkip(fid){
  post('/api/skip',{face_id:fid}).then(()=>{
    loadStats(); loadPage(currentPage);
  });
}

function openMerge(fid){
  mergeSource=fid;
  document.getElementById('mergeFilter').value='';
  // fetch 完整列表（按需）
  fetch(kq('/api/clusters')).then(r=>r.json()).then(list=>{
    allClusters = list.filter(c=>c.id!==fid);
    renderMergeOptions(allClusters);
    document.getElementById('mergeModal').classList.add('active');
    setTimeout(()=>document.getElementById('mergeFilter').focus(),50);
  });
}

function renderMergeOptions(list){
  const sel = document.getElementById('mergeTarget');
  sel.innerHTML = list.map(c=>
    `<option value="${c.id}">${c.id}${c.name?' · '+c.name:''} (${c.count} 張)</option>`
  ).join('');
}

function filterMergeOptions(){
  const q = document.getElementById('mergeFilter').value.toLowerCase();
  if(!q){ renderMergeOptions(allClusters); return; }
  const filtered = allClusters.filter(c=>
    c.id.toLowerCase().includes(q) || (c.name||'').toLowerCase().includes(q)
  );
  renderMergeOptions(filtered);
}

function confirmMerge(){
  const tgt = document.getElementById('mergeTarget').value;
  if(!tgt) return;
  // 多選 batch 模式
  if(mergeSources.length > 0){
    if(!confirm(`確定把 ${mergeSources.length} 個 cluster 合併到「${tgt}」？`)) return;
    post('/api/merge-batch', {source_ids: mergeSources, target_id: tgt}).then(r => r.json()).then(d => {
      closeMerge();
      mergeSources = [];
      // 離開多選模式並清掉選取狀態
      clusterSelectMode = false;
      selectedClusterIds.clear();
      document.getElementById('clusterSelectBtn').classList.remove('active');
      document.getElementById('clusterSelectBar').classList.remove('active');
      loadStats();
      loadPage(currentPage);
    });
    return;
  }
  post('/api/merge',{source_id:mergeSource,target_id:tgt}).then(()=>{
    closeMerge();
    loadStats();
    loadPage(currentPage);
  });
}

function closeMerge(){document.getElementById('mergeModal').classList.remove('active');}

function openMove(fid, imgPath){
  moveSource = fid;
  movePath = imgPath;
  document.getElementById('moveFilter').value = '';
  const ngn = document.getElementById('newGroupName'); if(ngn) ngn.value = '';
  document.getElementById('movePreview').innerHTML =
    `<img src="/img_thumb/${imgPath}?w=300" style="max-height:140px;border-radius:12px;box-shadow:0 4px 12px hsl(var(--n) / 0.10)">
     <div style="color:hsl(var(--bc) / 0.55);font-size:12px;margin-top:8px">來自 ${fid}</div>`;
  fetch(kq('/api/clusters')).then(r=>r.json()).then(list=>{
    allClusters = list.filter(c=>c.id !== fid);
    renderMoveOptions(allClusters);
    document.getElementById('moveModal').classList.add('active');
    setTimeout(()=>document.getElementById('moveFilter').focus(),50);
  });
}

function renderMoveOptions(list){
  const sel = document.getElementById('moveTarget');
  sel.innerHTML = list.map(c=>
    `<option value="${c.id}">${c.id}${c.name?' · '+c.name:''} (${c.count} 張)</option>`
  ).join('');
}

function filterMoveOptions(){
  const q = document.getElementById('moveFilter').value.toLowerCase();
  const filtered = q ? allClusters.filter(c=>
    c.id.toLowerCase().includes(q) || (c.name||'').toLowerCase().includes(q)
  ) : allClusters;
  renderMoveOptions(filtered);
}

function confirmMove(){
  const tgt = document.getElementById('moveTarget').value;
  if(!tgt) return;
  doMove(tgt);
}

function moveToNew(){
  const nm = (document.getElementById('newGroupName').value || '').trim();
  doMove('__new__', nm);
}

function doMove(tgt, newName){
  const isBatch = movePath === null;
  const batchBody = {from_id:moveSource, to_id:tgt, paths:[...selectedPaths]};
  const singleBody = {from_id:moveSource, to_id:tgt, image_path:movePath};
  if(newName){ batchBody.new_name = newName; singleBody.new_name = newName; }
  const req = isBatch ? post('/api/move-batch', batchBody) : post('/api/move', singleBody);
  req.then(r=>r.json()).then(d=>{
    closeMove();
    if(isBatch){
      selectMode = null;
      selectedPaths.clear();
      renderSelectBar();
    }
    loadStats();
    loadPage(currentPage).then(()=>{ if(openExpandFid) refreshExpandMeta(); });
    if(tgt === '__new__' && d && d.to_id){
      const nm = (document.getElementById('newGroupName')||{}).value || '';
      setTimeout(()=>{
        alert(nm.trim()
          ? `已建立新群組「${nm.trim()}」 (${d.to_id})`
          : `已建立新群組 ${d.to_id}，請後續手動命名。`);
      }, 100);
    }
  });
}

function closeMove(){document.getElementById('moveModal').classList.remove('active');}

function setAsThumb(fid, img){
  fetch('/api/set_thumb', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({face_id: fid, image_path: img})
  }).then(r=>r.json()).then(d=>{
    if(!d.ok){ alert('設定失敗：' + (d.error || '未知錯誤')); return; }
    // cache-bust 換新的縮圖 (face or pet kind 視 window.KIND 而定)
    const ts = Date.now();
    const fresh = thumbUrl(fid, ts);
    const base = (window.KIND === 'pet') ? '/pet_thumb/' : '/thumb/';
    document.querySelectorAll(`img.face-thumb[src*="${base}${fid}.jpg"]`).forEach(el=>{
      el.src = fresh;
    });
    const lrThumb = document.querySelector(`.lr-thumb[src*="${base}${fid}.jpg"]`);
    if(lrThumb) lrThumb.src = fresh;
  });
}

function removeImg(fid,img){
  post('/api/remove',{face_id:fid,image_path:img}).then(()=>{
    const c=ITEMS.find(x=>x.id===fid);
    if(c){
      c.images=c.images.filter(i=>i!==img);
      c.removed=[...(c.removed||[]),img];
      c.count=c.images.length;
      renderGrid();
    }
    if(openExpandFid===fid) refreshExpandMeta();
  });
}

function restoreImg(fid,img){
  post('/api/restore',{face_id:fid,image_path:img}).then(()=>{
    const c=ITEMS.find(x=>x.id===fid);
    if(c){
      c.images.push(img);
      c.removed=(c.removed||[]).filter(i=>i!==img);
      c.count=c.images.length;
      renderGrid();
    }
    if(openExpandFid===fid) refreshExpandMeta();
  });
}

function setFilter(f){
  filter=f;
  document.querySelectorAll('.toolbar button[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===f));
  // 清單模式只在 named filter 下可用
  const tgl = document.getElementById('viewToggle');
  if(f === 'named'){
    tgl.style.display = '';
  } else {
    tgl.style.display = 'none';
    if(viewMode === 'list'){
      viewMode = 'grid';
      tgl.innerHTML = '<i data-lucide="list"></i> 清單模式';
      window.refreshIcons && window.refreshIcons();
    }
  }
  loadPage(0);
}

function post(url,data){
  // 自動帶上目前的 KIND（face / pet），讓所有 admin mutation 落到對的檔案
  const payload = (window.KIND && data && typeof data === 'object' && !data.kind)
    ? {...data, kind: window.KIND} : data;
  return fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
}

// 在 URL 加上 kind 參數（給 GET 用）
function kq(url){
  if(!window.KIND || window.KIND === 'face') return url;   // 預設 face 不必加，向下相容
  const sep = url.includes('?') ? '&' : '?';
  return url + sep + 'kind=' + encodeURIComponent(window.KIND);
}

// 取得 cluster 縮圖路徑。kindOverride 可由 item.kind 傳入（用於 kind=all viewer 混合視圖）
function thumbUrl(fid, ver, kindOverride){
  const k = kindOverride || window.KIND;
  const base = (k === 'pet') ? '/pet_thumb/' : '/thumb/';
  return base + encodeURIComponent(fid) + '.jpg?v=' + (ver || 0);
}
</script>
